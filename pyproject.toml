[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-langchain-nano-x402"
version = "0.1.0"
description = "Experimental guarded LangChain x402 Nano client"
requires-python = ">=3.11"
dependencies = ["langchain==1.4.7", "feeless402==0.2.13", "requests==2.34.2"]

[tool.setuptools.packages.find]
where = ["src"]
